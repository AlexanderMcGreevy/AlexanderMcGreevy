name: Update scoreboard

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scoreboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate scoreboard
        id: gen
        continue-on-error: true
        env:
          PERSONAL_GH_TOKEN: ${{ secrets.PERSONAL_GH_TOKEN }}
          WORK_GH_TOKEN: ${{ secrets.WORK_GH_TOKEN }}
        run: python -m scoreboard

      - name: Commit scoreboard
        if: always()
        run: |
          [ -d assets ] || { echo "No assets directory; nothing to commit."; exit 0; }
          git add assets/
          if git diff --cached --quiet; then
            echo "No scoreboard changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update scoreboard"
            git push
          fi

      - name: Fail the job if generation failed
        if: always() && steps.gen.outcome == 'failure'
        run: |
          echo "::error::Scoreboard generation failed. Check the run log annotations to see which account or step failed."
          exit 1
